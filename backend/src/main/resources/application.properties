# Spring Boot Configuration - Behavioral Detection Engine

spring.application.name=lol-detector-backend
server.port=8085

# Database Configuration (MySQL 8.x)
spring.datasource.url=jdbc:mysql://localhost:3306/lol_detector_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rahul@2322
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# schema.sql is provided for manual MySQL Workbench setup
spring.sql.init.mode=never

# Multipart File Upload Limits (10MB Max File Size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Serialization Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
